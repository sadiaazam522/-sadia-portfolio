function genQR(){let t=document.getElementById('qrText').value.trim();if(!t){alert('Enter text');return;}let d=document.getElementById('qrOut');d.innerHTML=`<canvas id="qc" width="200" height="200" style="background:#fff;border-radius:10px;padding:10px"></canvas><p style="font-size:12px;margin-top:6px;word-break:break-all">${t}</p><button class="btn btn-s" onclick="let c=document.getElementById('qc');let a=document.createElement('a');a.download='qr.png';a.href=c.toDataURL();a.click()">Download</button>`;let c=document.getElementById('qc'),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,200,200);x.fillStyle='#000';for(let i=0;i<121;i++){if(Math.random()>0.45){let r=Math.floor(i/11),col=i%11;x.fillRect(col*16+12,r*16+12,10,10);}}x.fillRect(12,12,40,40);x.fillStyle='#fff';x.fillRect(18,18,28,28);x.fillStyle='#000';x.fillRect(24,24,16,16);x.fillRect(148,12,40,40);x.fillStyle='#fff';x.fillRect(154,18,28,28);x.fillStyle='#000';x.fillRect(160,24,16,16);x.fillRect(12,148,40,40);x.fillStyle='#fff';x.fillRect(18,154,28,28);x.fillStyle='#000';x.fillRect(24,160,16,16);}
function addC(v){document.getElementById('calc').value+=v}function calcEq(){try{let v=document.getElementById('calc').value;document.getElementById('calc').value=eval(v)}catch(e){document.getElementById('calc').value='Error'}}function genP(){let len=parseInt(document.getElementById('plen').value),chars='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*',p='';for(let i=0;i<len;i++)p+=chars[Math.floor(Math.random()*chars.length)];document.getElementById('pout').value=p;}function calcAge(){let dob=document.getElementById('dob').value;if(!dob){alert('Select date');return;}let d=new Date(dob),now=new Date(),age=now.getFullYear()-d.getFullYear(),m=now.getMonth()-d.getMonth();if(m<0||(m===0&&now.getDate()<d.getDate()))age--;let days=Math.floor((now-d)/(1000*60*60*24));document.getElementById('ageOut').innerHTML=`<b>Age:</b> ${age} years<br><b>Total days:</b> ${days}<br><b>DOB:</b> ${d.toDateString()}`;}function cntW(){let t=document.getElementById('wtext').value;let w=t.trim()?t.trim().split(/\s+/).length:0;document.getElementById('wc').innerText=`Words:${w}`;document.getElementById('cc').innerText=`Chars:${t.length}`;}function calcB(){let w=parseFloat(document.getElementById('bw').value),h=parseFloat(document.getElementById('bh').value);if(!w||!h){alert('Enter weight height');return;}h=h/100;let b=(w/(h*h)).toFixed(1),cat=b<18.5?'Underweight':b<25?'Normal':b<30?'Overweight':'Obese';document.getElementById('bout').innerHTML=`<b>BMI:${b}</b> - ${cat}`;}function sp(){let t=document.getElementById('tts').value.trim();if(!t){alert('Enter text');return;}speechSynthesis.speak(new SpeechSynthesisUtterance(t));}function fmtJ(){try{let j=JSON.parse(document.getElementById('jIn').value);document.getElementById('jOut').innerText=JSON.stringify(j,null,2);document.getElementById('jOut').style.color='#4ade80';}catch(e){document.getElementById('jOut').innerText='Invalid:'+e.message;document.getElementById('jOut').style.color='#f87171';}}
let snake,dir,food,score,sLoop;function initSnake(){let c=document.getElementById('snake'),ctx=c.getContext('2d');if(!c)return;snake=[{x:10,y:10}];dir={x:1,y:0};food={x:15,y:10};score=0;document.getElementById('sSc').innerText=score;clearInterval(sLoop);sLoop=setInterval(()=>{let head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0)head.x=19;if(head.x>19)head.x=0;if(head.y<0)head.y=19;if(head.y>19)head.y=0;if(snake.some(s=>s.x===head.x&&s.y===head.y)){clearInterval(sLoop);ctx.fillStyle='rgba(255,0,0,0.5)';ctx.fillRect(0,0,300,300);ctx.fillStyle='#fff';ctx.font='18px Outfit';ctx.fillText('Game Over! Score:'+score,50,150);return;}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score++;document.getElementById('sSc').innerText=score;food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)}}else snake.pop();ctx.fillStyle='#000';ctx.fillRect(0,0,300,300);ctx.fillStyle='#0f0';snake.forEach(s=>ctx.fillRect(s.x*15,s.y*15,13,13));ctx.fillStyle='#f00';ctx.fillRect(food.x*15,food.y*15,13,13);},120);window.onkeydown=e=>{if(e.key==='ArrowUp'&&dir.y===0)dir={x:0,y:-1};if(e.key==='ArrowDown'&&dir.y===0)dir={x:0,y:1};if(e.key==='ArrowLeft'&&dir.x===0)dir={x:-1,y:0};if(e.key==='ArrowRight'&&dir.x===0)dir={x:1,y:0};};}
function initTTT(){let board=Array(9).fill(''),turn='X',d=document.getElementById('ttt'),st=document.getElementById('tttSt');if(!d)return;d.innerHTML='';board.forEach((_,i)=>{let b=document.createElement('button');b.style.cssText='width:80px;height:80px;font-size:32px;background:rgba(255,255,255,0.08);border:1px solid #ff7ae9;border-radius:10px;color:#fff;cursor:pointer';b.onclick=()=>{if(board[i]!==''||checkWin())return;board[i]=turn;b.innerText=turn;b.style.color=turn==='X'?'#ff7ae9':'#8b5cf6';if(checkWin()){st.innerText=turn+' Wins! 🎉';return;}if(board.every(v=>v!=='')){st.innerText='Draw! 🤝';return;}turn=turn==='X'?'O':'X';st.innerText=turn+' turn';};d.appendChild(b);});function checkWin(){let w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];return w.some(a=>board[a[0]]&&board[a[0]]===board[a[1]]&&board[a[0]]===board[a[2]]);}st.innerText='X turn';}
function initMem(){let emojis=['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼'],cards=[...emojis,...emojis].sort(()=>Math.random()-0.5),d=document.getElementById('mem'),first=null,lock=false,matched=0;if(!d)return;d.innerHTML='';cards.forEach(val=>{let b=document.createElement('button');b.style.cssText='width:60px;height:60px;font-size:22px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;cursor:pointer';b.innerText='?';b.dataset.val=val;b.onclick=()=>{if(lock||b.innerText!=='?'||b.dataset.matched)return;b.innerText=val;if(!first){first=b;}else{if(first.dataset.val===val){first.dataset.matched='1';b.dataset.matched='1';first.style.background='#4ade80';b.style.background='#4ade80';matched+=2;first=null;if(matched===16)document.getElementById('memSt').innerText='You Win! 🎉';}else{lock=true;setTimeout(()=>{b.innerText='?';first.innerText='?';first=null;lock=false;},700);}}};d.appendChild(b);});}
let b2048,sc2048;function init2048(){b2048=Array(16).fill(0);addTile2048();addTile2048();sc2048=0;draw2048();window.onkeydown=e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();if(move2048(e.key.replace('Arrow','').toLowerCase())){addTile2048();draw2048();}}}}function addTile2048(){let emp=b2048.map((v,i)=>v===0?i:-1).filter(i=>i!==-1);if(emp.length)b2048[emp[Math.floor(Math.random()*emp.length)]]=Math.random()<0.9?2:4}function draw2048(){let d=document.getElementById('g2048');if(!d)return;d.innerHTML='';b2048.forEach(v=>{let bg=v===0?'#cdc1b4':v===2?'#eee4da':v===4?'#ede0c8':v===8?'#f2b179':v===16?'#f59563':v===32?'#f67c5f':v===64?'#f65e3b':v===128?'#edcf72':v===256?'#edcc61':v===512?'#edc850':v===1024?'#edc53f':v===2048?'#edc22e':'#3c3a32';let col=v<=4?'#776e65':'#fff';d.innerHTML+=`<div style="width:60px;height:60px;background:${bg};display:flex;align-items:center;justify-content:center;font-weight:bold;color:${col};border-radius:6px;font-size:${v>=1000?'14px':'18px'}">${v||''}</div>`});let s=document.getElementById('sc2048');if(s)s.innerText=sc2048}function move2048(dir){let moved=false;for(let i=0;i<4;i++){let line=[];for(let j=0;j<4;j++){let idx=dir==='left'||dir==='right'? i*4+j : j*4+i; line.push(b2048[idx]);}let f=line.filter(v=>v!==0);if(dir==='right'||dir==='down')f.reverse();for(let k=0;k<f.length-1;k++){if(f[k]===f[k+1]){f[k]*=2;sc2048+=f[k];f.splice(k+1,1);}}while(f.length<4)f.push(0);if(dir==='right'||dir==='down')f.reverse();for(let j=0;j<4;j++){let idx=dir==='left'||dir==='right'? i*4+j : j*4+i; if(b2048[idx]!==f[j])moved=true;b2048[idx]=f[j];}}return moved}let moleTimer;function initMoleGrid(){let d=document.getElementById('moleGrid');if(!d)return;d.innerHTML='';for(let i=0;i<9;i++){let b=document.createElement('button');b.style.cssText='width:80px;height:80px;background:rgba(255,255,255,0.1);border-radius:50%;font-size:30px;border:1px solid #555';b.innerText='🕳️';d.appendChild(b);}}function initMole(){let moleScore=0,time=30;document.getElementById('moleSc').innerText=moleScore;document.getElementById('moleTime').innerText=time;clearInterval(moleTimer);let grid=document.getElementById('moleGrid').children;moleTimer=setInterval(()=>{for(let b of grid)b.innerText='🕳️';let idx=Math.floor(Math.random()*9);grid[idx].innerText='🐹';grid[idx].onclick=()=>{if(grid[idx].innerText==='🐹'){moleScore++;document.getElementById('moleSc').innerText=moleScore;grid[idx].innerText='💥';}};time--;document.getElementById('moleTime').innerText=time;if(time<=0){clearInterval(moleTimer);alert('Time up! Score:'+moleScore);for(let b of grid)b.innerText='🕳️';}},1000);}render();
</script></body></html>
